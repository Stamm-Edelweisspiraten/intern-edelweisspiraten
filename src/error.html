<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Fehler %sveltekit.status%</title>
        <!--
            Rueckfallseite fuer Fehler, die den Router gar nicht erreichen --
            etwa ein Fehler im Hook oder im Root-Layout-Load. Hier gibt es
            weder Svelte-Komponenten noch die Design-Tokens aus Tailwind,
            deshalb Inline-Stil mit eigenen Werten fuer hell und dunkel.

            Das Abmelde-Formular ist der einzige Ausweg, wenn die interne
            Huelle samt Sidebar nicht geladen wurde: /logout ist oeffentlich
            und haengt an keiner Berechtigung.
        -->
        <style>
            :root {
                color-scheme: light dark;
                --bg: #f4f4f5;
                --surface: #ffffff;
                --border: #e4e4e7;
                --fg: #18181b;
                --fg-muted: #52525b;
                --primary: #2563eb;
                --primary-fg: #ffffff;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #18181b;
                    --surface: #27272a;
                    --border: #3f3f46;
                    --fg: #fafafa;
                    --fg-muted: #a1a1aa;
                    --primary: #3b82f6;
                    --primary-fg: #ffffff;
                }
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem 1rem;
                background: var(--bg);
                color: var(--fg);
                font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
            }
            main {
                width: 100%;
                max-width: 32rem;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 1rem;
                padding: 2rem;
                text-align: center;
            }
            p.code {
                margin: 0;
                font-size: 0.75rem;
                font-weight: 600;
                letter-spacing: 0.05em;
                text-transform: uppercase;
                color: var(--fg-muted);
            }
            h1 {
                margin: 0.5rem 0 1rem;
                font-size: 1.5rem;
            }
            p.message {
                margin: 0 0 1.5rem;
                color: var(--fg-muted);
            }
            button {
                font: inherit;
                font-weight: 600;
                cursor: pointer;
                padding: 0.75rem 1.25rem;
                border: 1px solid transparent;
                border-radius: 0.5rem;
                background: var(--primary);
                color: var(--primary-fg);
            }
            a {
                display: inline-block;
                margin-top: 1rem;
                font-size: 0.875rem;
                color: var(--fg-muted);
            }
        </style>
    </head>
    <body>
        <main>
            <p class="code">Fehler %sveltekit.status%</p>
            <h1>Diese Seite konnte nicht geladen werden</h1>
            <p class="message">%sveltekit.error.message%</p>

            <form method="post" action="/logout">
                <button type="submit">Abmelden</button>
            </form>

            <a href="/login">Zur Anmeldung</a>
        </main>
    </body>
</html>
